name: .NET 9 CI

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build project
      run: dotnet build --no-restore --configuration Release

    - name: Run tests
      run: dotnet test --no-build --configuration Release --verbosity normal

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH (Simulation)
      run: |
        echo "Creating .ssh directory..."
        echo "Loading SSH key from GitHub Secrets for user ${{ secrets.USERNAME }}..."
        echo "Adding host ${{ secrets.HOST }} to known_hosts..."
        
    - name: Deploy via SSH (Simulation)
      run: |
        echo "Executing command: ssh ${{ secrets.USERNAME }}@${{ secrets.HOST }} 'bash ~/deploy.sh'"
        echo "--- Server output ---"
        echo "Pulling latest changes from master..."
        echo "Stopping DogshouseService containers..."
        echo "Building new .NET 9 image..."
        echo "Starting new containers..."
        echo "Deployment to ${{ secrets.HOST }} completed successfully!"